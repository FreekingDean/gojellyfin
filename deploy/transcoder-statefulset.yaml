apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gojellyfin-transcoder
  labels:
    app.kubernetes.io/name: gojellyfin
    app.kubernetes.io/component: transcoder
spec:
  # A StatefulSet rather than a Deployment only for the stable names: pods are
  # <statefulset name>-<ordinal> and their DNS is <pod>.<serviceName>, which is
  # what TRANSCODER_WORKERS in configmap.yaml spells out. Both names are
  # load-bearing; renaming either means editing that list too.
  serviceName: gojellyfin-transcoder
  # Ordinal-indexed from zero, so these five are -0 through -4. Keep in step
  # with TRANSCODER_WORKERS.
  replicas: 5
  # The workers share no state and no ordering, so there is nothing to bring up
  # one at a time.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: gojellyfin
      app.kubernetes.io/component: transcoder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gojellyfin
        app.kubernetes.io/component: transcoder
    spec:
      containers:
        - name: transcoder
          # Same image and same binary as the API, differing only in the
          # subcommand. ffmpeg is already in it.
          image: ghcr.io/freekingdean/gojellyfin:latest
          args: ["transcoder"]
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: TRANSCODER_ADDR
              value: ":8082"
            - name: TRANSCODER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gojellyfin
                  key: TRANSCODER_TOKEN
            # No DATABASE_URL, on purpose: the transcoder never opens the
            # database. Adding one here would give a process that runs ffmpeg
            # on caller-supplied paths a set of credentials it has no use for.
          resources:
            # Nothing caps concurrent transcodes on a worker (#485), so this
            # limit is the only bound on what one pod will attempt. It is what
            # keeps a burst of encodes from starving the node instead of
            # starving each other, and it is why the ceiling is not simply set
            # high: past a few simultaneous encodes on one pod every stream on
            # it drops below realtime together. The request covers the steady
            # case — an audio encode runs well under a core — and the limit
            # leaves headroom for a handful at once.
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          # /healthz is served by the worker itself and answers 503 when ffmpeg
          # is not on PATH.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          # No runAsNonRoot: the image's USER is the name "gojellyfin" rather
          # than a uid, and kubelet refuses to start a container whose
          # non-rootness it cannot check numerically. The image drops privilege
          # on its own.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            # Identical mountPath to the API's. The API sends this pod the
            # item's path out of the database, so the two have to agree byte
            # for byte; read-only because the worker only ever opens sources.
            - name: media
              mountPath: /media
              readOnly: true
      # Deliberately not volumeClaimTemplates, which is the obvious thing to
      # reach for in a StatefulSet and is wrong here: it gives each pod its own
      # volume, and the whole point is that all five see the same files the API
      # sees.
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: gojellyfin-media
            readOnly: true
