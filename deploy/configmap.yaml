apiVersion: v1
kind: ConfigMap
metadata:
  name: gojellyfin
  labels:
    app.kubernetes.io/name: gojellyfin
data:
  # StatefulSet pods are ordinal-indexed from zero, so the five replicas in
  # transcoder-statefulset.yaml are -0 through -4. This list and that replica
  # count change together: a name here with no pod behind it costs the API a
  # dial timeout on every round trip that reaches it, and a pod missing from
  # here never gets work.
  #
  # Each entry is <pod>.<headless service>, which resolves only because
  # transcoder-service.yaml sets clusterIP: None.
  #
  # internal/transcode/pool.go splits on commas, trims surrounding whitespace,
  # prepends http:// when there is no scheme and trims a trailing slash, so
  # host:port is the whole of what belongs here and the folded block below is
  # read exactly as five addresses.
  TRANSCODER_WORKERS: >-
    gojellyfin-transcoder-0.gojellyfin-transcoder:8082,
    gojellyfin-transcoder-1.gojellyfin-transcoder:8082,
    gojellyfin-transcoder-2.gojellyfin-transcoder:8082,
    gojellyfin-transcoder-3.gojellyfin-transcoder:8082,
    gojellyfin-transcoder-4.gojellyfin-transcoder:8082
