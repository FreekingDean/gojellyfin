# Headless on purpose. Do not "tidy" clusterIP: None into a normal ClusterIP
# Service — it is the only reason
# gojellyfin-transcoder-0.gojellyfin-transcoder resolves to one specific pod.
# Give this Service a cluster IP and all five names in TRANSCODER_WORKERS
# collapse onto the same virtual IP, so the round robin in
# internal/transcode/pool.go stops distributing anything and its retry of the
# next worker just redials whichever pod the Service happens to pick.
apiVersion: v1
kind: Service
metadata:
  name: gojellyfin-transcoder
  labels:
    app.kubernetes.io/name: gojellyfin
    app.kubernetes.io/component: transcoder
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: gojellyfin
    app.kubernetes.io/component: transcoder
  ports:
    - name: http
      port: 8082
      targetPort: http
