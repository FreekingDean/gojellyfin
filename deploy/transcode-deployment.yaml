# The same image and the same subcommand as the API. What makes these pods the
# transcoders is the route in httproutes.yaml, not a second binary or a second
# protocol: the pod that serves the stream is the pod that runs ffmpeg, so there
# is no hop between them and nothing to map a session onto a worker.
#
# A Deployment rather than a StatefulSet, because nothing here is addressed
# individually any more. The API used to name each worker; now the gateway load
# balances over whatever is ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gojellyfin-transcode
  labels:
    app.kubernetes.io/name: gojellyfin
    app.kubernetes.io/component: transcode
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gojellyfin
      app.kubernetes.io/component: transcode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gojellyfin
        app.kubernetes.io/component: transcode
    spec:
      containers:
        - name: api
          image: ghcr.io/freekingdean/gojellyfin:latest
          args: ["server"]
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gojellyfin
                  key: DATABASE_URL
            # Keep at or below the cpu limit: one encode saturates about a core,
            # and a pod that accepts more than it can run makes every stream on
            # it slower without finishing any sooner. Above this the pod answers
            # 503, which the gateway retries against another pod — that refusal
            # is the whole of the load balancing.
            - name: TRANSCODER_JOBS
              value: "2"
            - name: TRANSCODER_STALL_TIMEOUT
              value: "30s"
          resources:
            requests:
              cpu: "2"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /System/Ping
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /System/Ping
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            # Read only, unlike the API's: nothing here deletes a file, and the
            # path stored on the item row is what ffmpeg opens, so /media has to
            # be the same file on both.
            - name: media
              mountPath: /media
              readOnly: true
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: gojellyfin-media
