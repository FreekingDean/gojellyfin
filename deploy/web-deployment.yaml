# jellyfin-web is not published on its own. There is no jellyfin/jellyfin-web
# image, no @jellyfin/web npm package, and the jellyfin-web releases carry no
# built assets — the only place the built client exists is inside the
# all-in-one jellyfin/jellyfin image, at /jellyfin/jellyfin-web.
#
# So an init container copies it out of that image into an emptyDir and nginx
# serves the copy. That keeps a second image, a second registry push and a
# second workflow out of this repository for what is a directory of static
# files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gojellyfin-web
  labels:
    app.kubernetes.io/name: gojellyfin
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gojellyfin
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gojellyfin
        app.kubernetes.io/component: web
    spec:
      initContainers:
        # Pin this to the API version the server implements — system.VERSION.
        # A client newer than the API calls endpoints that answer 501.
        - name: client
          image: jellyfin/jellyfin:10.10.0
          command: ["cp", "-a", "/jellyfin/jellyfin-web/.", "/client/"]
          volumeMounts:
            - name: client
              mountPath: /client
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        # The unprivileged image listens on 8080 and owns the directories nginx
        # writes to, which is what lets runAsNonRoot hold. Stock nginx wants
        # port 80 and root.
        - name: nginx
          image: nginxinc/nginx-unprivileged:alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            # The route strips nothing, so the client is served at the same
            # /web prefix the browser asks for.
            - name: client
              mountPath: /usr/share/nginx/html/web
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /web/index.html
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /web/index.html
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: client
          emptyDir: {}
