# The streaming paths go to the transcode pods and everything else to the API.
# That split is the whole of the transcoder: same image, same subcommand, and a
# route deciding which pods run ffmpeg.
#
# Both values below have to be edited — this repository cannot guess either.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gojellyfin-transcode
  labels:
    app.kubernetes.io/name: gojellyfin
    app.kubernetes.io/component: transcode
spec:
  parentRefs:
    - name: main
      namespace: networking
  hostnames:
    - gojellyfin.example.com
  rules:
    # A longer prefix outranks a shorter one, so these win over the API's "/"
    # without the two routes having to be ordered against each other.
    - matches:
        - path:
            type: PathPrefix
            value: /Videos
        - path:
            type: PathPrefix
            value: /Audio
      backendRefs:
        - name: gojellyfin-transcode
          # The Service's port, not the container's.
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gojellyfin-api
  labels:
    app.kubernetes.io/name: gojellyfin
    app.kubernetes.io/component: api
spec:
  parentRefs:
    - name: main
      namespace: networking
  hostnames:
    - gojellyfin.example.com
  rules:
    # Everything the transcode route did not claim. The API owns paths at the
    # root, so this cannot be narrowed to a prefix.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gojellyfin
          port: 80
