# Its own workflow rather than a step in ci.yml's test job, so it runs beside
# the unit tests instead of after them. It needs less than that job does: no
# ffmpeg, because nothing here transcodes, and no migrate step, because the
# test creates a scratch database and migrates that.
name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gojellyfin
          POSTGRES_PASSWORD: gojellyfin
          POSTGRES_DB: gojellyfin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Only ever connected to in order to CREATE DATABASE: the test runs against
    # a scratch database of its own and drops it on the way out.
    env:
      DATABASE_URL: postgres://gojellyfin:gojellyfin@localhost:5432/gojellyfin_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # gojellyfin migrate drives the atlas CLI, and the test runs that command
      # rather than reimplementing it.
      - uses: ariga/setup-atlas@v0

      - name: End to end
        run: go test -race -tags e2e -count 1 -timeout 5m ./cmd/gojellyfin/
