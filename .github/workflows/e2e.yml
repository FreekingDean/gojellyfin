# Jest driving the real jellyfin-web client in Chrome, in its own workflow so
# it runs beside the Go jobs rather than after them. continue-on-error keeps a
# red run from blocking a PR while the suite is new; take it off once it has
# been green for a while.
name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gojellyfin
          POSTGRES_PASSWORD: gojellyfin
          POSTGRES_DB: gojellyfin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Only ever connected to in order to CREATE DATABASE: the suite runs
    # against a scratch database of its own and drops it on the way out.
    env:
      DATABASE_URL: postgres://gojellyfin:gojellyfin@localhost:5432/gojellyfin_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # gojellyfin migrate drives the atlas CLI, and the harness runs that
      # command rather than reimplementing it.
      - uses: ariga/setup-atlas@v0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # jellyfin-web is not published on its own, so the only reproducible copy
      # is the one inside the all-in-one image. Cached so the 395MB pull
      # happens once per client version rather than once per run.
      - name: Cache the client
        id: client
        uses: actions/cache@v4
        with:
          path: e2e/.client
          key: jellyfin-web-10.10.0

      - name: Fetch the client
        if: steps.client.outputs.cache-hit != 'true'
        run: docker pull jellyfin/jellyfin:10.10.0

      - name: Install
        run: npm ci
        working-directory: e2e

      # ubuntu-latest ships Chrome, so puppeteer-core drives that rather than
      # downloading a browser of its own.
      - name: Test
        run: npm test
        working-directory: e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
