# Playwright driving the real jellyfin-web client, in its own workflow so it
# runs beside the Go jobs rather than after them. The browser runs in the
# Playwright image matching e2e/package-lock.json, which is what the committed
# screenshots were rendered in.
name: E2E

# The native clients run on an emulator, which is slow and less steady than a
# browser, so they are not part of every push: they run nightly against main,
# on demand, and on a pull request carrying the `e2e-clients` label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A label added right after a push would otherwise leave two runs publishing
# one pull request's gallery.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    if: >-
      github.event_name != 'schedule'
      && (github.event.action != 'labeled' || github.event.label.name == 'e2e-clients')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gojellyfin
          POSTGRES_PASSWORD: gojellyfin
          POSTGRES_DB: gojellyfin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Only ever connected to in order to CREATE DATABASE: the suite runs
    # against a scratch database of its own and drops it on the way out.
    env:
      DATABASE_URL: postgres://gojellyfin:gojellyfin@localhost:5432/gojellyfin_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # gojellyfin migrate drives the atlas CLI, and the harness runs that
      # command rather than reimplementing it.
      - uses: ariga/setup-atlas@v0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # jellyfin-web is not published on its own, so the only reproducible copy
      # is the one inside the all-in-one image. Cached so the 395MB pull
      # happens once per client version rather than once per run.
      - name: Cache the client
        id: client
        uses: actions/cache@v4
        with:
          path: e2e/.client
          key: jellyfin-web-12.4

      - name: Fetch the client
        if: steps.client.outputs.cache-hit != 'true'
        run: docker pull jellyfin/jellyfin:12.4

      # The playback spec encodes its fixture and the seed probes it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install
        run: npm ci
        working-directory: e2e

      - name: Test
        run: npm run visual
        working-directory: e2e

      # On a pull request and on main, every screenshot this commit rendered and the diff of
      # each that changed, beside a summary the gallery job renders from.
      - name: Collect the screenshots
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && hashFiles('e2e/.build/results.json') != ''
        working-directory: e2e
        run: |
          node setup/gallery.js collect web jellyfin-web .build/results.json .build/gallery tests/__screenshots__
          if [ -d playwright-report ]; then cp -r playwright-report .build/gallery/report; fi

      - name: Upload the screenshots
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && hashFiles('e2e/.build/gallery/web.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gallery-web
          path: e2e/.build/gallery
          retention-days: 3

      # Holds the actual, expected and diff images of every failed screenshot,
      # and a trace of every failed test. A deliberate visual change is
      # accepted by committing the actual images over the baselines, or by
      # running `make e2e-update` locally.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  # The stock Android apps on an emulator each, driven over adb against the
  # same harness the browser suite boots.
  clients:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'e2e-clients'))
      && (github.event.action != 'labeled' || github.event.label.name == 'e2e-clients')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: androidtv
            title: Android TV
            target: android-tv
            arch: x86
            profile: tv_1080p
          - suite: android
            title: Android
            target: google_apis
            arch: x86_64
            profile: pixel_6

    name: ${{ matrix.title }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gojellyfin
          POSTGRES_PASSWORD: gojellyfin
          POSTGRES_DB: gojellyfin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://gojellyfin:gojellyfin@localhost:5432/gojellyfin_test?sslmode=disable
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: ariga/setup-atlas@v0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # The harness fronts the API with jellyfin-web the way a deployment does,
      # a phone approving the television's code is served from it, and the
      # phone app is that client in a WebView.
      - name: Cache the web client
        id: client
        uses: actions/cache@v4
        with:
          path: e2e/.client
          key: jellyfin-web-12.4

      - name: Fetch the web client
        if: steps.client.outputs.cache-hit != 'true'
        run: docker pull jellyfin/jellyfin:12.4

      - name: Cache the app
        uses: actions/cache@v4
        with:
          path: e2e/.clients
          key: ${{ matrix.suite }}-${{ hashFiles(format('e2e/clients/{0}/app.js', matrix.suite)) }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install
        run: npm ci
        working-directory: e2e

      # Without this the runner user cannot open /dev/kvm and the emulator
      # falls back to software, where it does not finish booting.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CLIENT_RELEASE: ${{ github.event_name == 'schedule' && 'latest' || '' }}
        with:
          api-level: 34
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: e2e
          script: npm run ${{ matrix.suite }}

      - name: Collect the screenshots
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && hashFiles(format('e2e/.build/{0}-results.json', matrix.suite)) != ''
        working-directory: e2e
        run: node setup/gallery.js collect ${{ matrix.suite }} "${{ matrix.title }}" .build/${{ matrix.suite }}-results.json .build/gallery

      - name: Upload the screenshots
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && hashFiles(format('e2e/.build/gallery/{0}.json', matrix.suite)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: gallery-${{ matrix.suite }}
          path: e2e/.build/gallery
          retention-days: 3

      # What was on screen, the device's log and the server's, for each test
      # that failed.
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-results
          path: |
            e2e/test-results/${{ matrix.suite }}
            e2e/.build/server.log
          retention-days: 14

  # One page and one comment over every suite that ran. The suites collect in
  # their own jobs, so this only reads their summaries.
  gallery:
    needs: [e2e, clients]
    if: >-
      always() && github.event_name == 'pull_request'
      && needs.e2e.result != 'cancelled' && needs.e2e.result != 'skipped'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: gallery-*
          merge-multiple: true
          path: gallery

      - name: Render
        env:
          PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
        run: node e2e/setup/gallery.js render gallery "$PAGES" "${{ github.event.pull_request.head.sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-gallery
          path: gallery
          retention-days: 3

  # Serves the gallery from gh-pages under pr-<number>/<sha>/ and keeps one
  # comment on the PR pointing at it. A fork's token cannot write, so only a
  # branch of this repository is published. gh-pages holds a single commit
  # that is replaced on every publish, so it never accumulates history.
  publish:
    needs: gallery
    if: >-
      always() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.gallery.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: gh-pages-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write

    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: e2e-gallery
          path: gallery

      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1

      - name: Publish
        working-directory: site
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4; do
            git fetch --depth 1 origin gh-pages
            git reset --hard origin/gh-pages
            rm -rf "pr-$PR"
            mkdir -p "pr-$PR/$SHA"
            cp -r ../gallery/. "pr-$PR/$SHA/"
            rm "pr-$PR/$SHA/comment.md"
            git add -A -- "pr-$PR"
            commit=$(git commit-tree "$(git write-tree)" -m "Publish e2e screenshots for #$PR at $SHA")
            if git push --force-with-lease="gh-pages:$(git rev-parse origin/gh-pages)" origin "$commit:refs/heads/gh-pages"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      # Pages deploys a minute or so after the push. Posting before then would
      # have GitHub's image proxy fetch, and remember, a 404.
      - name: Wait for Pages
        run: |
          url=$(grep -o 'https://[^")]*-current.png' gallery/comment.md | head -1)
          for _ in $(seq 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = 200 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::warning::$url did not come up within ten minutes"

      - name: Comment
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- e2e-screenshots -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@gallery/comment.md >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@gallery/comment.md >/dev/null
          fi

  # main keeps a gallery of its own at /main/ that no pull request's cleanup
  # touches. The suites run on different triggers, the browser on every push
  # and the emulators nightly, so each run replaces only the suites it ran and
  # the page is rendered again over all of them, each stamped with the commit
  # it last ran at.
  main-gallery:
    needs: [e2e, clients]
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && (needs.e2e.result == 'success' || needs.e2e.result == 'failure'
      || needs.clients.result == 'success' || needs.clients.result == 'failure')
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: gh-pages-main
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          path: source

      - uses: actions/download-artifact@v4
        with:
          pattern: gallery-*
          merge-multiple: true
          path: gallery

      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1

      - name: Publish
        working-directory: site
        env:
          PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/main
        run: |
          shopt -s nullglob
          summaries=(../gallery/*.json)
          if [ ${#summaries[@]} = 0 ]; then
            echo "::warning::no suite collected any screenshots"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch --depth 1 origin gh-pages
            git reset --hard origin/gh-pages
            mkdir -p main/shots
            for summary in "${summaries[@]}"; do
              slug=$(basename "$summary" .json)
              rm -rf "main/shots/$slug"
              if [ -d "../gallery/shots/$slug" ]; then cp -r "../gallery/shots/$slug" main/shots/; fi
              jq --arg sha "$GITHUB_SHA" --arg at "$(date -u +%Y-%m-%dT%H:%MZ)" '. + {sha: $sha, at: $at}' "$summary" > "main/$slug.json"
              if [ "$slug" = web ]; then
                rm -rf main/report
                if [ -d ../gallery/report ]; then cp -r ../gallery/report main/report; fi
              fi
            done
            node ../source/e2e/setup/gallery.js render main "$PAGES" "$GITHUB_SHA"
            rm main/comment.md
            git add -A -- main
            commit=$(git commit-tree "$(git write-tree)" -m "Publish e2e screenshots for main at $GITHUB_SHA")
            if git push --force-with-lease="gh-pages:$(git rev-parse origin/gh-pages)" origin "$commit:refs/heads/gh-pages"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
