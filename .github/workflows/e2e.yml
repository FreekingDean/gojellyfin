# Playwright driving the real jellyfin-web client, in its own workflow so it
# runs beside the Go jobs rather than after them. The browser runs in the
# Playwright image matching e2e/package-lock.json, which is what the committed
# screenshots were rendered in.
name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gojellyfin
          POSTGRES_PASSWORD: gojellyfin
          POSTGRES_DB: gojellyfin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Only ever connected to in order to CREATE DATABASE: the suite runs
    # against a scratch database of its own and drops it on the way out.
    env:
      DATABASE_URL: postgres://gojellyfin:gojellyfin@localhost:5432/gojellyfin_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # gojellyfin migrate drives the atlas CLI, and the harness runs that
      # command rather than reimplementing it.
      - uses: ariga/setup-atlas@v0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # jellyfin-web is not published on its own, so the only reproducible copy
      # is the one inside the all-in-one image. Cached so the 395MB pull
      # happens once per client version rather than once per run.
      - name: Cache the client
        id: client
        uses: actions/cache@v4
        with:
          path: e2e/.client
          key: jellyfin-web-10.10.0

      - name: Fetch the client
        if: steps.client.outputs.cache-hit != 'true'
        run: docker pull jellyfin/jellyfin:10.10.0

      # The playback spec encodes its fixture and the seed probes it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install
        run: npm ci
        working-directory: e2e

      - name: Test
        run: npm run visual
        working-directory: e2e

      # Holds the actual, expected and diff images of every failed screenshot,
      # and a trace of every failed test. A deliberate visual change is
      # accepted by committing the actual images over the baselines, or by
      # running `make e2e-update` locally.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
