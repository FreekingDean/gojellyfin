# Removes a closed pull request's screenshots from gh-pages, so the branch
# only ever holds the open ones. It shares the publish job's per-PR
# concurrency group, so a publish still running for this PR is cancelled
# rather than racing it; other PRs' writes are handled by the lease retry.
name: E2E pages cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    env:
      PR: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1

      - name: Remove
        working-directory: site
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4; do
            git fetch --depth 1 origin gh-pages
            git reset --hard origin/gh-pages
            if [ ! -d "pr-$PR" ]; then
              exit 0
            fi
            rm -rf "pr-$PR"
            git add -A -- "pr-$PR"
            commit=$(git commit-tree "$(git write-tree)" -m "Remove e2e screenshots for #$PR")
            if git push --force-with-lease="gh-pages:$(git rev-parse origin/gh-pages)" origin "$commit:refs/heads/gh-pages"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
