# Builds the docs site from docs/ on every pull request that touches it, with
# --strict so a broken link or anchor fails the check, and publishes it on a
# merge to main. Pages serves the gh-pages branch, which the e2e workflows
# share: they own main/ and pr-*/, and this job owns everything else, so it
# replaces the rest of the tree and leaves those alone.
name: Docs

on:
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - run: pip install -r requirements-docs.txt

      - name: Build
        run: mkdocs build --strict --site-dir site

      - name: Refuse paths the e2e gallery owns
        run: |
          shopt -s nullglob
          clash=(site/pr-*)
          if [ -e site/main ]; then clash+=(site/main); fi
          if [ ${#clash[@]} != 0 ]; then
            echo "::error::docs may not publish ${clash[*]#site/}: the e2e gallery owns those paths on gh-pages"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-docs
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: docs-site

      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 1

      - name: Publish
        working-directory: pages
        run: |
          shopt -s dotglob extglob
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch --depth 1 origin gh-pages
            git reset --hard origin/gh-pages
            rm -rf -- !(.git|main|pr-*)
            cp -r ../docs-site/. .
            touch .nojekyll
            git add -A
            commit=$(git commit-tree "$(git write-tree)" -m "Publish docs at $GITHUB_SHA")
            if git push --force-with-lease="gh-pages:$(git rev-parse origin/gh-pages)" origin "$commit:refs/heads/gh-pages"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
