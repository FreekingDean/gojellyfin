name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          gofmt -w internal cmd
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      # Generated api code is excluded: it is ~95k lines emitted by oapi-codegen.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The api and the store are generated from the spec and the ent schema,
      # so a diff here means someone hand-edited generated code or forgot to
      # re-run generation after changing a source.
      - name: Generate
        run: go generate ./...

      - name: No diff
        run: git diff --exit-code

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gojellyfin
          POSTGRES_PASSWORD: gojellyfin
          POSTGRES_DB: gojellyfin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://gojellyfin:gojellyfin@localhost:5432/gojellyfin_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: ariga/setup-atlas@v0

      # The transcode tests run a real worker against real ffmpeg rather than a
      # stub, so a green run means bytes a player can decode came back.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Nothing migrates at startup, so the schema has to be applied before any
      # test can reach it. Only `migrate diff` needs Docker; `apply` does not.
      - name: Migrate
        run: atlas migrate apply --dir "file://internal/store/migrations" --url "$DATABASE_URL"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      # Behind a build tag so `make test` stays fast, but run on every PR: it
      # reuses the postgres and atlas this job already has, creates a scratch
      # database of its own, and is the only check that the server serves.
      - name: End to end
        run: go test -race -tags e2e -count 1 -timeout 5m ./cmd/gojellyfin/
