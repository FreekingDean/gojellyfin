name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          gofmt -w internal cmd
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      # Generated api code is excluded: it is ~95k lines emitted by oapi-codegen.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint --strict charts/gojellyfin

      # The combinations that have to keep rendering. A chart is only exercised
      # by being rendered, and nothing else here would notice a template that
      # stopped.
      - name: Render
        run: |
          set -e
          render() { helm template gojellyfin charts/gojellyfin "$@" > /dev/null; }
          render
          render --set streaming.enabled=false
          render --set web.enabled=false
          render --set worker.enabled=true --set temporal.hostPort=temporal:7233 --set temporal.namespace=default
          render --set migration.enabled=true
          render --set sources.existingSecret=gojellyfin-sources
          render --set hostname=example.test --set httpRoute.enabled=true --set httpRoute.parentRefs[0].name=gateway
          render --set cors.enabled=true --set cors.origin=https://example.test
          render --set serverId=5f0a1b2c3d4e4f6a8b9c0d1e2f3a4b5c
          render --set hostname=example.test --set oidc.issuerUrl=https://auth.example.test --set oidc.clientId=gojellyfin \
            --set oidc.existingSecret=gojellyfin-oidc --set oidc.adminGroup=admins --set oidc.linkExistingUsers=true
          render --set oidc.issuerUrl=https://auth.example.test --set oidc.existingSecret=gojellyfin-oidc
          render --set pod=null --set api.resources=null
          render --set worker.enabled=true --set temporal.hostPort=temporal:7233 --set temporal.namespace=default \
            --set worker.autoscaling.enabled=true --set worker.podDisruptionBudget.enabled=true
          render --set worker.enabled=true --set temporal.hostPort=temporal:7233 --set temporal.namespace=default \
            --set worker.autoscaling.enabled=true --set worker.autoscaling.behavior=null --set worker.stopTimeoutSeconds=0 \
            --set pod=null --set worker.pod.terminationGracePeriodSeconds=60
          render --set worker.enabled=true --set temporal.hostPort=temporal:7233 --set temporal.namespace=default --set migration.enabled=true \
            --set-json 'env=[{"name":"HOST_IP","valueFrom":{"fieldRef":{"fieldPath":"status.hostIP"}}}]' \
            --set 'tracing.otlpEndpoint=http://$(HOST_IP):4318' \
            --set-json 'media.extraVolumes=[{"name":"archive","mountPath":"/archive","volume":{"emptyDir":{}}}]' \
            --set-json 'pod.labels={"istio.io/dataplane-mode":"none"}' \
            --set-json 'service.labels={"istio.io/use-waypoint":"none"}'

      # The chart refuses the combinations that would deploy something quietly
      # broken. A guard nothing tests is a guard that stops firing.
      - name: Refuse what cannot work
        run: |
          refuses() {
            if helm template gojellyfin charts/gojellyfin "$@" > /dev/null 2>&1; then
              echo "rendered instead of failing: $*"
              exit 1
            fi
          }
          refuses --set cors.enabled=true
          refuses --set worker.enabled=true
          refuses --set temporal.hostPort=temporal:7233
          refuses --set worker.enabled=true --set temporal.hostPort=temporal:7233 --set temporal.namespace=default \
            --set worker.autoscaling.enabled=true --set worker.resources=null
          refuses --set worker.enabled=true --set temporal.hostPort=temporal:7233 --set temporal.namespace=default \
            --set worker.autoscaling.enabled=true --set worker.autoscaling.minReplicas=4 --set worker.autoscaling.maxReplicas=2
          refuses --set oidc.issuerUrl=https://auth.example.test --set oidc.clientId=gojellyfin

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The api and the store are generated from the spec and the ent schema,
      # so a diff here means someone hand-edited generated code or forgot to
      # re-run generation after changing a source.
      - name: Generate
        run: go generate ./...

      - name: No diff
        run: git diff --exit-code

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gojellyfin
          POSTGRES_PASSWORD: gojellyfin
          POSTGRES_DB: gojellyfin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://gojellyfin:gojellyfin@localhost:5432/gojellyfin_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: ariga/setup-atlas@v0

      # The transcode tests run a real worker against real ffmpeg rather than a
      # stub, so a green run means bytes a player can decode came back.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Nothing migrates at startup, so the schema has to be applied before any
      # test can reach it. Only `migrate diff` needs Docker; `apply` does not.
      - name: Migrate
        run: atlas migrate apply --dir "file://internal/store/migrations" --url "$DATABASE_URL"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...
