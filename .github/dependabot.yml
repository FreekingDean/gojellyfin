version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    labels: []
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: github.com/getkin/kin-openapi
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /admin
      - /e2e
    labels: []
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    labels: []
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    labels: []
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    labels: []
    schedule:
      interval: weekly
      day: monday
    groups:
      docs:
        update-types: [minor, patch]
