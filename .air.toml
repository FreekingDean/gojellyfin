root = "."
tmp_dir = ".air"

[build]
cmd = "go build -o ./.air/gojellyfin ./cmd/gojellyfin"
bin = "./.air/gojellyfin"
args_bin = ["server"]
include_ext = ["go"]
exclude_dir = [".air", ".git", ".worktrees", "spec"]
# Generated by `go generate ./internal/server/api`, not by hand. Watching them
# only adds churn; they still compile as part of the build.
exclude_regex = ["_test\\.go$", "\\.gen\\.go$"]
exclude_unchanged = true
stop_on_error = true
# fx runs migrations and the library scan on start, so give the old process
# time to release :8081 before the new one binds it.
kill_delay = "1s"
send_interrupt = true

[misc]
clean_on_exit = true
