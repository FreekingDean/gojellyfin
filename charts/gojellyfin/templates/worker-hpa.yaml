{{- if and .Values.worker.enabled .Values.worker.autoscaling.enabled }}
{{- $autoscaling := .Values.worker.autoscaling }}
{{- if not (dig "requests" "cpu" "" (.Values.worker.resources | default dict)) }}
{{- fail "worker.autoscaling needs worker.resources.requests.cpu: cpu utilization is measured against the request" }}
{{- end }}
{{- if gt (int $autoscaling.minReplicas) (int $autoscaling.maxReplicas) }}
{{- fail "worker.autoscaling.minReplicas is above maxReplicas" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "gojellyfin.fullname" . }}-worker
  labels:
    {{- include "gojellyfin.labels" (dict "root" $ "component" "worker") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "gojellyfin.fullname" . }}-worker
  minReplicas: {{ $autoscaling.minReplicas }}
  maxReplicas: {{ $autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $autoscaling.targetCPUUtilizationPercentage }}
  {{- with $autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
