{{- if and .Values.worker.enabled .Values.worker.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gojellyfin.fullname" . }}-worker
  labels:
    {{- include "gojellyfin.labels" (dict "root" $ "component" "worker") | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.worker.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "gojellyfin.selectorLabels" (dict "root" $ "component" "worker") | nindent 6 }}
{{- end }}
