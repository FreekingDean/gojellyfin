{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.enabled needs httpRoute.parentRefs: a route with no Gateway is attached to nothing" }}
{{- end }}
{{- if .Values.streaming.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "gojellyfin.fullname" . }}-streaming
  labels:
    {{- include "gojellyfin.labels" (dict "root" $ "component" "streaming") | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.hostname }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /Videos
        - path:
            type: PathPrefix
            value: /Audio
      backendRefs:
        - name: {{ include "gojellyfin.fullname" . }}-streaming
          port: {{ .Values.streaming.service.port }}
---
{{- end }}
{{- if .Values.web.enabled }}
