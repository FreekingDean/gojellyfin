{{- if .Values.transcode.enabled }}
{{- $component := "transcode" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gojellyfin.fullname" . }}-transcode
  labels:
    {{- include "gojellyfin.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.transcode.replicaCount }}
  selector:
    matchLabels:
      {{- include "gojellyfin.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      {{- with .Values.transcode.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gojellyfin.selectorLabels" (dict "root" $ "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.transcode.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "gojellyfin.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server"]
          ports:
            - name: http
              containerPort: {{ .Values.httpPort }}
          env:
            {{- include "gojellyfin.serverEnv" (dict "root" $ "workload" .Values.transcode "component" $component) | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /System/Ping
              port: http
            {{- with .Values.transcode.livenessProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /System/Ping
              port: http
            {{- with .Values.transcode.readinessProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.transcode.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.transcode.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "gojellyfin.mediaVolumeMount" (dict "root" $ "workload" .Values.transcode) | nindent 12 }}
      volumes:
        {{- include "gojellyfin.mediaVolume" (dict "root" $) | nindent 8 }}
      {{- with .Values.transcode.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.transcode.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.transcode.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
