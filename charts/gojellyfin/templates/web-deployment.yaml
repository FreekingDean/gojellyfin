{{- if .Values.web.enabled }}
{{- $component := "web" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gojellyfin.fullname" . }}-web
  labels:
    {{- include "gojellyfin.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "gojellyfin.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gojellyfin.selectorLabels" (dict "root" $ "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: client
          image: {{ printf "%s:%s" .Values.web.client.repository .Values.web.client.tag }}
          imagePullPolicy: {{ .Values.web.client.pullPolicy }}
          command: ["cp", "-a", "/jellyfin/jellyfin-web/.", "/client/"]
          volumeMounts:
            - name: client
              mountPath: /client
          {{- with .Values.web.client.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      containers:
        - name: nginx
          image: {{ printf "%s:%s" .Values.web.image.repository .Values.web.image.tag }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort }}
          volumeMounts:
            - name: client
              mountPath: /usr/share/nginx/html/web
              readOnly: true
          livenessProbe:
            httpGet:
              path: /web/index.html
              port: http
            {{- with .Values.web.livenessProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /web/index.html
              port: http
            {{- with .Values.web.readinessProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: client
          emptyDir: {}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
