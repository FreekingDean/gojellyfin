nameOverride: ""
fullnameOverride: ""

# The name clients reach the server by. The routes match it and
# PUBLISHED_SERVER_URL advertises it; empty advertises no address at all, which
# is deliberate — a client that is handed an address it cannot reach stops
# talking to the one that did reach it.
hostname: ""
# What the gateway in front of this listens on, and the only thing it is used
# for. http here is not an oversight to fix: advertising https over a plain
# listener is the same lost client as advertising a wrong hostname.
scheme: https

# The id this server answers with. A client keys the token it holds by it, so a
# server taking over from a Jellyfin install is given that install's id, which
# is the contents of device.txt beside its jellyfin.db and what
# scripts/jellyfinmigrate prints. Empty keeps gojellyfin's own.
serverId: ""

image:
  repository: ghcr.io/freekingdean/gojellyfin
  # Empty takes the chart's appVersion. Every workload and the migration Job
  # share it: the migrations are embedded in the binary, so two tags mean the
  # schema one image applied and the schema the other expects can differ.
  tag: ""
  # Empty is Always for a tag that moves and IfNotPresent for one that does
  # not, so a node that has already pulled `latest` still sees a new build.
  pullPolicy: ""

# HTTP_PORT.
httpPort: 8081

# Extra environment for the API, the streaming pods and the worker, as a
# container env list. It comes first, so a value elsewhere in the chart can
# refer to one of these as $(NAME) — a node-local collector's address read off
# status.hostIP, say.
env: []

database:
  # DATABASE_URL is required and the binary carries no default. Create the
  # Secret yourself so no credential passes through values. Empty names a
  # Secret with the release's own fullname.
  existingSecret: ""
  secretKey: DATABASE_URL

# TMDB_API_KEY, out of a Secret you create. Empty turns metadata lookups off:
# items keep the titles their source reported and get no artwork.
tmdb:
  existingSecret: ""
  secretKey: TMDB_API_KEY

# The SOURCE_API_KEY_* variables a Sonarr or Radarr source names, out of a
# Secret you create whose keys are those names. The API tests a source with
# them and the worker scans with them.
sources:
  existingSecret: ""

# Single sign-on through an OpenID Connect provider, offered on the login page
# as a "Sign in with SSO" button. Empty issuerUrl leaves it off. It needs
# hostname, because the provider sends the browser back to
# <scheme>://<hostname>/sso/oidc/callback, which is the redirect URI to
# register with it. The client secret comes out of a Secret you create; leave
# existingSecret empty for a public client, which PKCE still protects.
# Sign-on stays off until issuerUrl and clientId are both set, so the rest can
# be written down before the provider has issued a client id.
oidc:
  issuerUrl: ""
  clientId: ""
  existingSecret: ""
  secretKey: OIDC_CLIENT_SECRET
  # Space separated. Empty asks for "openid profile email".
  scopes: ""
  # Empty reads preferred_username and groups.
  usernameClaim: ""
  groupsClaim: ""
  # A member of adminGroup signs in as an administrator and loses it on the
  # next sign-in after leaving. Empty leaves administrator alone.
  adminGroup: ""
  # Empty lets anyone the provider vouches for sign in, creating their account.
  allowedGroup: ""
  # Let the first sign-in claim a local account with the same username rather
  # than refusing it. Only safe when the provider does not let people choose
  # their own username.
  linkExistingUsers: false

# TRUSTED_PROXIES. The networks the gateway's pods sit in, usually the pod
# CIDR. A request from one of them is taken to be from the rightmost address in
# X-Forwarded-For that is not, which is what lets a phone's /link find the
# television signing in on the same network. Empty trusts no header and sees
# every request as coming from the gateway.
trustedProxies: []

# CORS_ORIGINS. Off allows only https://apps.jellyfin.org, the Google Cast
# receiver, which the server always allows. Enabled adds one origin and needs
# it — the chart refuses to render a restriction that would
# restrict nothing.
cors:
  enabled: false
  origin: ""

# OTEL_EXPORTER_OTLP_ENDPOINT. Empty exports no traces.
tracing:
  otlpEndpoint: ""

# TEMPORAL_HOSTPORT and TEMPORAL_NAMESPACE. With hostPort empty, background
# work is off and the server still starts.
temporal:
  hostPort: ""
  namespace: ""

# The media the server reads, mounted from wherever it already lives. Whatever
# it is has to be the same media at the same path in every pod, because the API
# hands ffmpeg the path on the item row. The API mounts it writable and every
# other workload read-only, which is a property of what each one does rather
# than a choice to make here.
media:
  mountPath: /media
  # MEDIA_DIRECTORIES, the roots the library browser offers when a library is
  # added. Empty offers mountPath, so the browser starts where the media is
  # rather than at / as the binary's own default does.
  directories: []
  # Any volume source: persistentVolumeClaim, nfs, hostPath. Empty mounts an
  # emptyDir, which is a library with nothing in it.
  volume: {}
  # More media beside it, each a name, a mountPath and a volume source, mounted
  # into every workload the same way the first one is. Their paths join
  # MEDIA_DIRECTORIES when that is left empty.
  extraVolumes: []
  # - name: archive
  #   mountPath: /archive
  #   volume:
  #     persistentVolumeClaim:
  #       claimName: archive

# `gojellyfin migrate` as a pre-install/pre-upgrade hook. We will default this to true
# whenever a release includes a migration. You may hardcode it to false if you want
# to always migrate yourself.
migration:
  enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# How long the API and streaming pods keep serving after they are told to stop,
# before they close their listener. Removing a pod from its Service's endpoints
# happens beside the SIGTERM rather than before it, so without the pause a
# gateway still holding the old endpoints sends requests to a pod that has just
# stopped accepting them. After it the server has 15s to finish what it holds;
# a stream still running then is cut, and the client re-asks for it from where
# it was, landing on another pod.
drainSeconds: 5

# Every Service this chart creates. They are ClusterIP addresses for the routes
# below to name; an Ingress needs a controller and a class this chart cannot
# guess.
service:
  type: ClusterIP
  port: 80
  annotations: {}
  labels: {}

# Merged into every pod the chart renders. A workload's own `pod:` overrides
# this key by key, which is the escape hatch for anything the chart does not
# name: a toleration, a runtime class, a topology constraint.
pod:
  annotations: {}
  # Added to the pod template's labels. The selector labels are the chart's and
  # win a collision, because a pod that stops matching its own Deployment is
  # orphaned rather than relabelled.
  labels: {}
  # Nothing here talks to the Kubernetes API, so no pod is handed a token.
  automountServiceAccountToken: false
  imagePullSecrets: []
  securityContext: {}
  # No runAsNonRoot: the image's USER is a name rather than a uid, and kubelet
  # refuses to start a container whose non-rootness it cannot check
  # numerically. The image drops privilege on its own.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  nodeSelector: {}
  tolerations: []
  affinity: {}

api:
  # Ignored while autoscaling is enabled, as for the worker.
  replicas: 2
  # TRANSCODER_JOBS. Empty follows the cpu request, one encode to a core.
  transcoderJobs: ""
  transcoderStallTimeout: 30s
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # Every API pod is interchangeable: sessions, quick connect, SyncPlay and
  # websocket delivery all live in Postgres, so a request can land anywhere and
  # nothing needs session affinity.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Pods
            value: 1
            periodSeconds: 120
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
  pod: {}

# The same image and the same subcommand as the API. What makes these pods the
# streaming pods is the route: /Videos and /Audio go to them, so the pod that
# serves the stream is the pod that runs ffmpeg. Disabled, the API serves those
# paths itself.
streaming:
  enabled: true
  # Ignored while autoscaling is enabled.
  replicas: 3
  transcoderJobs: ""
  transcoderStallTimeout: 30s
  resources:
    requests:
      cpu: "2"
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  # An encode is one request from start to finish, so a stream needs no
  # affinity either: a pod past its slots answers 503 and the gateway tries
  # another. Scaling in cuts the streams on the pod that goes, and each client
  # resumes on another, which is why scale-in is slow.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 600
        policies:
          - type: Pods
            value: 1
            periodSeconds: 300
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
  pod: {}

# `gojellyfin worker` — the Temporal worker. It needs temporal.hostPort;
# without one it crash loops, so the chart refuses to render it.
worker:
  enabled: false
  # Ignored while autoscaling is enabled: the Deployment then carries no
  # replica count, so an upgrade does not reset what the autoscaler chose.
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # TEMPORAL_WORKER_STOP_TIMEOUT. On SIGTERM the worker stops polling and gives
  # the activities it holds this long to finish; what is still running after
  # that is cancelled and retried elsewhere. The pod's
  # terminationGracePeriodSeconds follows it with 30s to spare, unless
  # worker.pod names one itself.
  stopTimeoutSeconds: 300
  # A HorizontalPodAutoscaler on cpu. Utilization is measured against
  # resources.requests.cpu, so the chart refuses to render one without it.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    # Passed through as the HPA's behavior. The default takes a pod away at
    # most once every two minutes after five quiet ones, so a lull between
    # two scans does not drain a worker the second scan wants back.
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Pods
            value: 1
            periodSeconds: 120
  # A PodDisruptionBudget, which is what a node drain, kured or the descheduler
  # honours. It does not slow the autoscaler, which scales in without evicting.
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
  pod: {}

# jellyfin-web is not published on its own — no image, no npm package, and the
# releases carry no built assets — so an init container copies it out of the
# all-in-one jellyfin image into an emptyDir and nginx serves the copy.
web:
  enabled: true
  replicas: 2
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
  client:
    # Pin this to the client `make e2e` drives, which is the only one the
    # suite has shown to work: a client newer than what is implemented calls
    # endpoints that answer 501.
    repository: jellyfin/jellyfin
    tag: "12.4"
    pullPolicy: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  # The unprivileged image listens on 8080 and owns the directories nginx
  # writes to, which is what lets runAsNonRoot hold.
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.31.7-alpine
    pullPolicy: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  # 101 is the unprivileged image's nginx user. Set on the pod so the client
  # init container, whose image would otherwise run as root, copies as it too.
  pod:
    securityContext:
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101

# Gateway API. Off by default: a parentRef names a Gateway this chart cannot
# guess. /Videos and /Audio go to the streaming pods, /web to the client and
# everything else to the API, plus the two API paths that live under /web.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  # - name: main
  #   namespace: networking
