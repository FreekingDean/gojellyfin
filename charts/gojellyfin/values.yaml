nameOverride: ""
fullnameOverride: ""

# The name clients reach the server by. The routes match it and
# PUBLISHED_SERVER_URL advertises it; empty advertises no address at all, which
# is deliberate — a client that is handed an address it cannot reach stops
# talking to the one that did reach it.
hostname: ""
# What the gateway in front of this listens on, and the only thing it is used
# for. http here is not an oversight to fix: advertising https over a plain
# listener is the same lost client as advertising a wrong hostname.
scheme: https

image:
  repository: ghcr.io/freekingdean/gojellyfin
  # Empty takes the chart's appVersion. Every workload and the migration Job
  # share it: the migrations are embedded in the binary, so two tags mean the
  # schema one image applied and the schema the other expects can differ.
  tag: ""
  # Empty is Always for a tag that moves and IfNotPresent for one that does
  # not, so a node that has already pulled `latest` still sees a new build.
  pullPolicy: ""

# HTTP_PORT.
httpPort: 8081

database:
  # DATABASE_URL is required and the binary carries no default. Create the
  # Secret yourself so no credential passes through values. Empty names a
  # Secret with the release's own fullname.
  existingSecret: ""
  secretKey: DATABASE_URL

# TMDB_API_KEY, out of a Secret you create. Empty leaves metadata lookups
# unauthenticated and failing.
tmdb:
  existingSecret: ""
  secretKey: TMDB_API_KEY

# CORS_ORIGINS. Off reflects whatever origin asks; a literal "*" is not
# equivalent, because browsers reject it on credentialed requests. Enabled
# needs an origin — the chart refuses to render a restriction that would
# restrict nothing.
cors:
  enabled: false
  origin: ""

# OTEL_EXPORTER_OTLP_ENDPOINT. Empty exports no traces.
tracing:
  otlpEndpoint: ""

# TEMPORAL_HOSTPORT and TEMPORAL_NAMESPACE. With hostPort empty, background
# work is off and the server still starts.
temporal:
  hostPort: ""
  namespace: ""

# The media the server reads, mounted from wherever it already lives. Whatever
# it is has to be the same media at the same path in every pod, because the API
# hands ffmpeg the path on the item row. The API mounts it writable and every
# other workload read-only, which is a property of what each one does rather
# than a choice to make here.
media:
  mountPath: /media
  # MEDIA_DIRECTORIES, the roots the library browser offers when a library is
  # added. Empty offers mountPath, so the browser starts where the media is
  # rather than at / as the binary's own default does.
  directories: []
  # Any volume source: persistentVolumeClaim, nfs, hostPath. Empty mounts an
  # emptyDir, which is a library with nothing in it.
  volume: {}

# `gojellyfin migrate` as a pre-install/pre-upgrade hook. We will default this to true
# whenever a release includes a migration. You may hardcode it to false if you want
# to always migrate yourself.
migration:
  enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Every Service this chart creates. They are ClusterIP addresses for the routes
# below to name; an Ingress needs a controller and a class this chart cannot
# guess.
service:
  type: ClusterIP
  port: 80
  annotations: {}

# Merged into every pod the chart renders. A workload's own `pod:` overrides
# this key by key, which is the escape hatch for anything the chart does not
# name: a toleration, a runtime class, a topology constraint.
pod:
  annotations: {}
  imagePullSecrets: []
  securityContext: {}
  # No runAsNonRoot: the image's USER is a name rather than a uid, and kubelet
  # refuses to start a container whose non-rootness it cannot check
  # numerically. The image drops privilege on its own.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  affinity: {}

api:
  replicas: 2
  # TRANSCODER_JOBS. Empty follows the cpu request, one encode to a core.
  transcoderJobs: ""
  transcoderStallTimeout: 30s
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  pod: {}

# The same image and the same subcommand as the API. What makes these pods the
# streaming pods is the route: /Videos and /Audio go to them, so the pod that
# serves the stream is the pod that runs ffmpeg. Disabled, the API serves those
# paths itself.
streaming:
  enabled: true
  replicas: 3
  transcoderJobs: ""
  transcoderStallTimeout: 30s
  resources:
    requests:
      cpu: "2"
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  pod: {}

# `gojellyfin worker` — the Temporal worker. It needs temporal.hostPort;
# without one it crash loops, so the chart refuses to render it.
worker:
  enabled: false
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  pod: {}

# jellyfin-web is not published on its own — no image, no npm package, and the
# releases carry no built assets — so an init container copies it out of the
# all-in-one jellyfin image into an emptyDir and nginx serves the copy.
web:
  enabled: true
  replicas: 2
  client:
    # Pin this to a released client, not to the API version the server
    # announces: that is 12.0.0 out of the vendored spec, 12 has no released
    # all-in-one image to copy a client out of, and a client newer than what is
    # implemented calls endpoints that answer 501. 10.10.0 is what `make e2e`
    # drives.
    repository: jellyfin/jellyfin
    tag: "10.10.0"
    pullPolicy: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  # The unprivileged image listens on 8080 and owns the directories nginx
  # writes to, which is what lets runAsNonRoot hold.
  image:
    repository: nginxinc/nginx-unprivileged
    tag: alpine
    pullPolicy: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  pod:
    containerSecurityContext:
      runAsNonRoot: true

# Gateway API. Off by default: a parentRef names a Gateway this chart cannot
# guess. /Videos and /Audio go to the streaming pods, /web to the client and
# everything else to the API, plus the two API paths that live under /web.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  # - name: main
  #   namespace: networking
