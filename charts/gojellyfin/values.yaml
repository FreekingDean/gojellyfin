nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/freekingdean/gojellyfin
  # Empty takes the chart's appVersion. Every workload and the migration Job
  # share it: the migrations are embedded in the binary, so two tags mean the
  # schema one image applied and the schema the other expects can differ.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The name clients reach the server by. The routes match it and
# PUBLISHED_SERVER_URL advertises it; empty advertises no address at all.
hostname: ""

# HTTP_PORT.
httpPort: 8081

database:
  # DATABASE_URL is required and the binary carries no default. Create the
  # Secret yourself so no credential passes through values. Empty names a
  # Secret with the release's own fullname.
  existingSecret: ""
  secretKey: DATABASE_URL

# TMDB_API_KEY, out of a Secret you create. Empty leaves metadata lookups
# unauthenticated and failing.
tmdb:
  existingSecret: ""
  secretKey: TMDB_API_KEY

# CORS_ORIGINS. Off reflects whatever origin asks; a literal "*" is not
# equivalent, because browsers reject it on credentialed requests.
cors:
  enabled: false
  origin: ""

# OTEL_EXPORTER_OTLP_ENDPOINT. Empty exports no traces.
tracing:
  otlpEndpoint: ""

# TEMPORAL_HOSTPORT and TEMPORAL_NAMESPACE. With hostPort empty, background
# work is off and the server still starts.
temporal:
  hostPort: ""
  namespace: ""

# The media the server reads, mounted from wherever it already lives — a claim,
# an NFS export, a hostPath. Whatever it is has to be the same media at the
# same path in every pod, because the API hands ffmpeg the path on the item row.
media:
  mountPath: /media
  # Any volume source: persistentVolumeClaim, nfs, hostPath. Empty mounts an
  # emptyDir, which is a library with nothing in it.
  volume: {}

# `gojellyfin migrate` as a pre-install/pre-upgrade hook. We will default this to true
# whenever a release includes a migration. You may hardcode it to false if you want
# to always migrate yourself.
migration:
  enabled: false
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

api:
  replicaCount: 2
  # TRANSCODER_JOBS. Empty follows the cpu request, one encode to a core.
  transcoderJobs: ""
  transcoderStallTimeout: 30s
  # Writable, unlike the streaming pods': DeleteItem removes the file.
  mediaReadOnly: false
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # Merged onto a fixed httpGet of /System/Ping, the only endpoint that is both
  # public and free of any database access.
  livenessProbe:
    periodSeconds: 20
  readinessProbe:
    periodSeconds: 10
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  # No runAsNonRoot: the image's USER is a name rather than a uid, and kubelet
  # refuses to start a container whose non-rootness it cannot check
  # numerically. The image drops privilege on its own.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podSecurityContext: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# The same image and the same subcommand as the API. What makes these pods the
# streaming pods is the route: /Videos and /Audio go to them, so the pod that
# serves the stream is the pod that runs ffmpeg. Disabled, the API serves those
# paths itself.
streaming:
  enabled: true
  replicaCount: 3
  transcoderJobs: ""
  transcoderStallTimeout: 30s
  mediaReadOnly: true
  resources:
    requests:
      cpu: "2"
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  livenessProbe:
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    periodSeconds: 10
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podSecurityContext: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# `gojellyfin worker` — the Temporal worker. It needs temporal.hostPort;
# without one it crash loops, so the chart refuses to render it.
worker:
  enabled: false
  replicaCount: 1
  mediaReadOnly: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podSecurityContext: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# jellyfin-web is not published on its own — no image, no npm package, and the
# releases carry no built assets — so an init container copies it out of the
# all-in-one jellyfin image into an emptyDir and nginx serves the copy.
web:
  enabled: true
  replicaCount: 2
  client:
    # Pin this to the API version the server implements. A client newer than
    # the API calls endpoints that answer 501.
    repository: jellyfin/jellyfin
    tag: "10.10.0"
    pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  # The unprivileged image listens on 8080 and owns the directories nginx
  # writes to, which is what lets runAsNonRoot hold.
  image:
    repository: nginxinc/nginx-unprivileged
    tag: alpine
    pullPolicy: IfNotPresent
  containerPort: 8080
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  livenessProbe:
    periodSeconds: 20
  readinessProbe:
    periodSeconds: 10
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podSecurityContext: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Gateway API. Off by default: a parentRef names a Gateway this chart cannot
# guess. /Videos and /Audio go to the streaming pods, /web to the client and
# everything else to the API — a longer prefix outranks a shorter one, so the
# routes need no ordering between them.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  # - name: main
  #   namespace: networking
