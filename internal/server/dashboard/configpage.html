<!DOCTYPE html>
<html lang="en">
<head>
    <title>Library Sources</title>
</head>
<body>
<div data-role="page" id="gojellyfinSourcesPage" class="page type-interior pluginConfigurationPage fullWidthContent"
     data-require="emby-input,emby-button,emby-select">
    <div class="content-primary">
        <div class="verticalSection">
            <div class="sectionTitleContainer flex align-items-center">
                <h2 class="sectionTitle">Library Sources</h2>
            </div>
            <p class="fieldDescription">
                Connect a Sonarr or Radarr instance and bind it to a library. Several instances may feed one
                library, and one instance may feed several libraries when each binding names a different tag.
                Each connection is saved on its own.
            </p>
        </div>

        <div id="connectionCards" class="itemsContainer vertical-wrap"></div>

        <div id="connectionEditor" class="verticalSection" style="display:none"></div>
    </div>

    <template id="cardTemplate">
        <div class="card backdropCard scalableCard backdropCard-scalable" style="cursor:pointer">
            <div class="cardBox cardBox-bottompadded">
                <div class="cardScalable">
                    <div class="cardPadder cardPadder-backdrop"></div>
                    <div class="cardContent cardContent-shadow">
                        <div data-id="tile" class="cardImageContainer coveredImage defaultCardBackground defaultCardBackground1">
                            <span data-id="icon" class="cardImageIcon material-icons"></span>
                        </div>
                    </div>
                </div>
                <div class="cardFooter">
                    <div data-id="name" class="cardText"></div>
                    <div data-id="detail" class="cardText cardText-secondary"></div>
                    <div data-id="health" class="cardText cardText-secondary"></div>
                </div>
            </div>
        </div>
    </template>

    <template id="editorTemplate">
        <div class="verticalSection" style="border:1px solid rgba(127,127,127,.25);border-radius:4px;padding:1.25em">
            <div class="flex align-items-center" style="gap:1em;flex-wrap:wrap">
                <div class="inputContainer" style="flex:2 1 16em;margin-bottom:0">
                    <label class="inputLabel inputLabelUnfocused">Name</label>
                    <input type="text" data-id="txtName" class="emby-input" placeholder="Radarr 4K" />
                </div>
                <div class="selectContainer" style="flex:1 1 10em;margin-bottom:0">
                    <label class="selectLabel">Type</label>
                    <select data-id="selKind" class="emby-select-withcolor emby-select">
                        <option value="radarr">Radarr</option>
                        <option value="sonarr">Sonarr</option>
                    </select>
                </div>
            </div>

            <div class="inputContainer">
                <label class="inputLabel inputLabelUnfocused">URL</label>
                <input type="url" data-id="txtUrl" class="emby-input" placeholder="http://radarr:7878" />
                <div class="fieldDescription">The address this server reaches the instance on, not the one your browser uses.</div>
            </div>

            <div class="inputContainer">
                <label class="inputLabel inputLabelUnfocused">API key variable</label>
                <select data-id="selApiKeyVariable" class="emby-select-withcolor emby-select"></select>
                <div class="fieldDescription">
                    The environment variable on the server that holds the key; the key itself is never stored.
                    Take the key from Settings &rarr; General &rarr; Security in Sonarr or Radarr and set it on
                    the server as a variable beginning with SOURCE_API_KEY_. Only variables already set are offered.
                </div>
            </div>

            <div class="flex align-items-center" style="gap:1em;margin-bottom:1.5em">
                <button is="emby-button" data-id="testConnection" type="button" class="raised raised-mini">
                    <span>Test connection</span>
                </button>
                <span data-id="testResult" class="fieldDescription" style="margin:0"></span>
            </div>

            <h3 class="checkboxListLabel">Folders</h3>
            <p class="fieldDescription">
                Test connection lists the instance's root folders. For each one, pick the library folder this
                server opens the same files at. No two instances may claim the same folder.
            </p>
            <p data-id="noFolders" class="fieldDescription" style="display:none">
                No library has a folder yet. Add the folder to a library under
                <a is="emby-linkbutton" class="button-link" href="#/dashboard/libraries">Libraries</a> first,
                then come back here.
            </p>
            <table style="width:100%">
                <thead>
                    <tr>
                        <th style="text-align:left;width:50%">Folder in the instance</th>
                        <th style="text-align:left;width:50%">Folder on this server</th>
                        <th style="text-align:right"></th>
                    </tr>
                </thead>
                <tbody data-id="pathsHost"></tbody>
            </table>
            <button is="emby-button" data-id="addPath" type="button" class="raised raised-mini">
                <span>Add folder</span>
            </button>

            <h3 class="checkboxListLabel">Libraries</h3>
            <p class="fieldDescription">
                Each row binds this instance to one library. The tag filter is optional and empty means every
                title the instance manages.
            </p>
            <table style="width:100%">
                <thead>
                    <tr>
                        <th style="text-align:left;width:60%">Library</th>
                        <th style="text-align:left;width:40%">Tag filter</th>
                        <th style="text-align:right"></th>
                    </tr>
                </thead>
                <tbody data-id="bindingsHost"></tbody>
            </table>
            <button is="emby-button" data-id="addBinding" type="button" class="raised raised-mini">
                <span>Add library</span>
            </button>

            <div class="flex align-items-center" style="gap:1em;margin-top:1.5em">
                <button is="emby-button" data-id="saveConnection" type="button" class="raised raised-mini button-submit">
                    <span>Save</span>
                </button>
                <button is="emby-button" data-id="cancelEditing" type="button" class="raised raised-mini">
                    <span>Cancel</span>
                </button>
                <span data-id="saveResult" class="fieldDescription" style="margin:0"></span>
                <button is="emby-button" data-id="removeConnection" type="button" class="raised raised-mini" style="margin-left:auto">
                    <span>Remove</span>
                </button>
            </div>
        </div>
    </template>

    <template id="pathTemplate">
        <tr>
            <td style="vertical-align:top;padding-right:1em">
                <select data-id="selRemotePath" class="emby-select-withcolor emby-select"></select>
            </td>
            <td style="vertical-align:top;padding-right:1em">
                <select data-id="selLocalPath" class="emby-select-withcolor emby-select"></select>
            </td>
            <td style="vertical-align:top;text-align:right">
                <button is="emby-button" data-id="removePath" type="button" class="raised raised-mini">
                    <span>Remove</span>
                </button>
            </td>
        </tr>
    </template>

    <template id="bindingTemplate">
        <tr>
            <td style="vertical-align:top;padding-right:1em">
                <select data-id="selLibrary" class="emby-select-withcolor emby-select"></select>
            </td>
            <td style="vertical-align:top;padding-right:1em">
                <input type="text" data-id="txtTag" class="emby-input" placeholder="4k" />
            </td>
            <td style="vertical-align:top;text-align:right">
                <button is="emby-button" data-id="removeBinding" type="button" class="raised raised-mini">
                    <span>Remove</span>
                </button>
            </td>
        </tr>
    </template>

    <script type="text/javascript">
        window.GoJellyfinSources = {
            collectionTypes: { radarr: 'movies', sonarr: 'tvshows' },
            icons: { radarr: 'movie', sonarr: 'live_tv' },
            names: { radarr: 'Radarr', sonarr: 'Sonarr' },

            libraries: [],
            connections: [],
            variables: [],
            editing: -1,

            page: function () {
                return document.querySelector('#gojellyfinSourcesPage');
            },

            kind: function (connection) {
                return (connection.Kind || 'radarr').toLowerCase();
            },

            bound: function (count) {
                if (count === 0) {
                    return 'No libraries';
                }

                return count === 1 ? '1 library' : count + ' libraries';
            },

            health: function (connection) {
                if (connection.LastError) {
                    return 'Unreachable: ' + connection.LastError;
                }
                if (connection.ContactedAt) {
                    return 'Answered ' + new Date(connection.ContactedAt).toLocaleString() +
                        (connection.Version ? ' · v' + connection.Version : '');
                }

                return 'Not scanned yet';
            },

            card: function (connection, index) {
                const source = window.GoJellyfinSources;
                const clone = document.querySelector('#cardTemplate').content.cloneNode(true);
                const card = clone.querySelector('.card');
                const kind = source.kind(connection);

                card.querySelector('[data-id=name]').textContent = connection.Name || 'Unnamed connection';
                card.querySelector('[data-id=detail]').textContent =
                    source.names[kind] + ' · ' + source.bound((connection.Libraries || []).length);
                card.querySelector('[data-id=health]').textContent = source.health(connection);
                card.querySelector('[data-id=icon]').classList.add(source.icons[kind]);
                card.querySelector('[data-id=tile]').classList.add('defaultCardBackground' + ((index % 5) + 1));

                card.addEventListener('click', function () {
                    source.openEditor(index);
                });

                return clone;
            },

            addCard: function () {
                const source = window.GoJellyfinSources;
                const clone = document.querySelector('#cardTemplate').content.cloneNode(true);
                const card = clone.querySelector('.card');

                card.querySelector('[data-id=name]').textContent = 'Add connection';
                card.querySelector('[data-id=detail]').textContent = 'Sonarr or Radarr';
                card.querySelector('[data-id=icon]').classList.add('add');
                card.querySelector('[data-id=tile]').classList.add('defaultCardBackground5');

                card.addEventListener('click', function () {
                    source.openEditor(-1);
                });

                return clone;
            },

            render: function () {
                const source = window.GoJellyfinSources;
                const host = source.page().querySelector('#connectionCards');

                host.innerHTML = '';
                source.connections.forEach(function (connection, index) {
                    host.appendChild(source.card(connection, index));
                });
                host.appendChild(source.addCard());
            },

            fillLibraries: function (select, kind, selected) {
                const wanted = window.GoJellyfinSources.collectionTypes[kind];
                const matching = window.GoJellyfinSources.libraries.filter(function (library) {
                    return library.ItemId === selected || !wanted || !library.CollectionType ||
                        library.CollectionType === wanted || library.CollectionType === 'mixed';
                });

                select.innerHTML = '';
                matching.forEach(function (library) {
                    const option = document.createElement('option');
                    option.value = library.ItemId;
                    option.textContent = library.Name;
                    select.appendChild(option);
                });

                if (selected && matching.some(function (library) { return library.ItemId === selected; })) {
                    select.value = selected;
                }
            },

            addBinding: function (editor, binding) {
                const clone = document.querySelector('#bindingTemplate').content.cloneNode(true);
                const row = clone.querySelector('tr');
                const kind = editor.querySelector('[data-id=selKind]').value;

                row.querySelector('[data-id=txtTag]').value = binding.TagFilter || '';
                window.GoJellyfinSources.fillLibraries(row.querySelector('[data-id=selLibrary]'), kind, binding.Id);

                row.querySelector('[data-id=removeBinding]').addEventListener('click', function () {
                    row.remove();
                });

                editor.querySelector('[data-id=bindingsHost]').appendChild(clone);
            },

            fillSelect: function (select, placeholder, choices, selected) {
                select.innerHTML = '';

                const blank = document.createElement('option');
                blank.value = '';
                blank.textContent = placeholder;
                select.appendChild(blank);

                choices.forEach(function (choice) {
                    const option = document.createElement('option');
                    option.value = choice.value;
                    option.textContent = choice.label;
                    if (choice.library) {
                        option.dataset.library = choice.library;
                    }
                    select.appendChild(option);
                });

                if (selected && !choices.some(function (choice) { return choice.value === selected; })) {
                    const missing = document.createElement('option');
                    missing.value = selected;
                    missing.textContent = choices.length ? selected + ' (no longer offered)' : selected;
                    select.appendChild(missing);
                }

                select.value = selected || '';
            },

            fillVariable: function (editor, selected) {
                const source = window.GoJellyfinSources;

                source.fillSelect(editor.querySelector('[data-id=selApiKeyVariable]'),
                    source.variables.length ? 'Choose a variable' : 'No SOURCE_API_KEY_ variable is set on the server',
                    source.variables.map(function (name) { return { value: name, label: name }; }),
                    selected);
            },

            libraryFolders: function () {
                const folders = [];

                window.GoJellyfinSources.libraries.forEach(function (library) {
                    (library.Locations || []).forEach(function (location) {
                        folders.push({ value: location, label: location + ' (' + library.Name + ')', library: library.ItemId });
                    });
                });

                return folders;
            },

            fillRemote: function (editor, select, selected) {
                window.GoJellyfinSources.fillSelect(select,
                    editor.rootFolders.length ? 'Choose a root folder' : 'Test connection to list root folders',
                    editor.rootFolders.map(function (folder) { return { value: folder, label: folder }; }),
                    selected);
            },

            bindFolder: function (editor, local) {
                const chosen = local.selectedOptions[0];
                const library = chosen && chosen.dataset.library;

                if (!library) {
                    return;
                }

                const bound = Array.prototype.some.call(editor.querySelectorAll('[data-id=selLibrary]'), function (select) {
                    return select.value === library;
                });
                if (!bound) {
                    window.GoJellyfinSources.addBinding(editor, { Id: library });
                }
            },

            addPath: function (editor, mapping) {
                const source = window.GoJellyfinSources;
                const clone = document.querySelector('#pathTemplate').content.cloneNode(true);
                const row = clone.querySelector('tr');
                const remote = row.querySelector('[data-id=selRemotePath]');
                const local = row.querySelector('[data-id=selLocalPath]');

                source.fillRemote(editor, remote, mapping.RemotePath);
                source.fillSelect(local, 'Choose a library folder', source.libraryFolders(), mapping.LocalPath);

                local.addEventListener('change', function () {
                    source.bindFolder(editor, local);
                });

                row.querySelector('[data-id=removePath]').addEventListener('click', function () {
                    row.remove();
                });

                editor.querySelector('[data-id=pathsHost]').appendChild(clone);

                return row;
            },

            offerFolders: function (editor, folders) {
                const source = window.GoJellyfinSources;
                const rows = Array.prototype.slice.call(editor.querySelectorAll('[data-id=pathsHost] tr'));
                const mapped = rows.map(function (row) { return row.querySelector('[data-id=selRemotePath]').value; });
                const libraryFolders = source.libraryFolders();

                editor.rootFolders = folders;
                rows.forEach(function (row) {
                    const remote = row.querySelector('[data-id=selRemotePath]');
                    source.fillRemote(editor, remote, remote.value);
                });

                const added = folders.filter(function (folder) { return mapped.indexOf(folder) < 0; });
                added.forEach(function (folder) {
                    const same = libraryFolders.some(function (candidate) { return candidate.value === folder; });
                    const row = source.addPath(editor, { RemotePath: folder, LocalPath: same ? folder : '' });
                    if (same) {
                        source.bindFolder(editor, row.querySelector('[data-id=selLocalPath]'));
                    }
                });

                return added.length;
            },

            openEditor: function (index) {
                const source = window.GoJellyfinSources;
                const connection = index < 0 ? { Kind: 'radarr', Paths: [], Libraries: [] } : source.connections[index];
                const host = source.page().querySelector('#connectionEditor');
                const clone = document.querySelector('#editorTemplate').content.cloneNode(true);
                const editor = clone.querySelector('.verticalSection');

                source.editing = index;

                editor.querySelector('[data-id=txtName]').value = connection.Name || '';
                editor.querySelector('[data-id=selKind]').value = source.kind(connection);
                editor.querySelector('[data-id=txtUrl]').value = connection.Url || '';
                editor.rootFolders = [];
                source.fillVariable(editor, connection.ApiKeyVariable);
                editor.querySelector('[data-id=noFolders]').style.display = source.libraryFolders().length ? 'none' : '';
                editor.querySelector('[data-id=removeConnection]').style.display = index < 0 ? 'none' : '';

                editor.querySelector('[data-id=selKind]').addEventListener('change', function (e) {
                    editor.querySelectorAll('[data-id=selLibrary]').forEach(function (select) {
                        source.fillLibraries(select, e.target.value, select.value);
                    });
                });

                editor.querySelector('[data-id=addPath]').addEventListener('click', function () {
                    source.addPath(editor, {});
                });

                editor.querySelector('[data-id=addBinding]').addEventListener('click', function () {
                    source.addBinding(editor, {});
                });

                editor.querySelector('[data-id=testConnection]').addEventListener('click', function () {
                    source.testConnection(editor);
                });

                editor.querySelector('[data-id=saveConnection]').addEventListener('click', function () {
                    source.saveConnection(editor);
                });

                editor.querySelector('[data-id=cancelEditing]').addEventListener('click', function () {
                    source.closeEditor();
                });

                editor.querySelector('[data-id=removeConnection]').addEventListener('click', function () {
                    source.removeConnection(connection);
                });

                host.innerHTML = '';
                host.appendChild(clone);
                host.style.display = '';

                (connection.Libraries || []).forEach(function (binding) {
                    source.addBinding(editor, binding);
                });
                (connection.Paths || []).forEach(function (mapping) {
                    source.addPath(editor, mapping);
                });
                if (index >= 0) {
                    source.testConnection(editor);
                }

                host.scrollIntoView({ block: 'nearest' });
            },

            closeEditor: function () {
                const host = window.GoJellyfinSources.page().querySelector('#connectionEditor');

                window.GoJellyfinSources.editing = -1;
                host.innerHTML = '';
                host.style.display = 'none';
            },

            readEditor: function (editor) {
                const rows = function (selector) {
                    return Array.prototype.slice.call(editor.querySelectorAll(selector));
                };

                return {
                    Name: editor.querySelector('[data-id=txtName]').value.trim(),
                    Kind: editor.querySelector('[data-id=selKind]').value,
                    Url: editor.querySelector('[data-id=txtUrl]').value.trim().replace(/\/+$/, ''),
                    ApiKeyVariable: editor.querySelector('[data-id=selApiKeyVariable]').value,
                    Paths: rows('[data-id=pathsHost] tr').map(function (row) {
                        return {
                            RemotePath: row.querySelector('[data-id=selRemotePath]').value,
                            LocalPath: row.querySelector('[data-id=selLocalPath]').value
                        };
                    }),
                    Libraries: rows('[data-id=bindingsHost] tr').map(function (row) {
                        return {
                            Id: row.querySelector('[data-id=selLibrary]').value,
                            TagFilter: row.querySelector('[data-id=txtTag]').value.trim()
                        };
                    })
                };
            },

            testConnection: function (editor) {
                const source = window.GoJellyfinSources;
                const result = editor.querySelector('[data-id=testResult]');
                const connection = source.readEditor(editor);

                if (!connection.Url || !connection.ApiKeyVariable) {
                    result.textContent = 'Enter the URL and choose the API key variable first.';

                    return;
                }

                result.textContent = 'Testing…';

                window.ApiClient.ajax({
                    type: 'POST',
                    url: window.ApiClient.getUrl('GoJellyfin/Sources/Test'),
                    data: JSON.stringify({
                        Kind: connection.Kind,
                        Url: connection.Url,
                        ApiKeyVariable: connection.ApiKeyVariable
                    }),
                    contentType: 'application/json',
                    dataType: 'json'
                }).then(function (response) {
                    if (!response.Reachable) {
                        result.textContent = 'Failed: ' + (response.Error || 'unreachable');

                        return;
                    }

                    const added = source.offerFolders(editor, response.RootFolders || []);

                    result.textContent = 'Reachable' + (response.Version ? ', version ' + response.Version : '') +
                        (added ? '. Added ' + added + ' root folder(s): pick the library folder for each.' : '');
                }).catch(function (error) {
                    result.textContent = 'Failed: ' + (error && error.statusText ? error.statusText : 'request refused');
                });
            },

            refused: function (error) {
                if (error && typeof error.json === 'function') {
                    return error.json().then(function (body) {
                        return body && body.Message ? body.Message : error.statusText;
                    }).catch(function () {
                        return error.statusText;
                    });
                }

                return Promise.resolve(error && error.statusText ? error.statusText : 'request refused');
            },

            saveConnection: function (editor) {
                const source = window.GoJellyfinSources;
                const result = editor.querySelector('[data-id=saveResult]');
                const existing = source.editing < 0 ? null : source.connections[source.editing];
                const connection = source.readEditor(editor);
                const unpicked = connection.Paths.some(function (mapping) { return !mapping.RemotePath || !mapping.LocalPath; });

                if (!connection.ApiKeyVariable) {
                    result.textContent = 'Not saved: choose the API key variable.';

                    return;
                }
                if (unpicked) {
                    result.textContent = 'Not saved: pick both folders on every row, or remove the row.';

                    return;
                }

                result.textContent = 'Saving…';

                window.ApiClient.ajax({
                    type: existing ? 'PUT' : 'POST',
                    url: window.ApiClient.getUrl(existing ? 'GoJellyfin/Sources/' + existing.Id : 'GoJellyfin/Sources'),
                    data: JSON.stringify(connection),
                    contentType: 'application/json',
                    dataType: 'json'
                }).then(function () {
                    source.loadConfig();
                }).catch(function (error) {
                    source.refused(error).then(function (reason) {
                        result.textContent = 'Not saved: ' + reason;
                    });
                });
            },

            removeConnection: function (connection) {
                const source = window.GoJellyfinSources;

                if (!window.confirm('Remove ' + (connection.Name || 'this connection') +
                    '? Every file it reported leaves your libraries until it is added again.')) {
                    return;
                }

                window.ApiClient.ajax({
                    type: 'DELETE',
                    url: window.ApiClient.getUrl('GoJellyfin/Sources/' + connection.Id)
                }).then(function () {
                    source.loadConfig();
                }).catch(function (error) {
                    console.error(error);
                    Dashboard.alert('The connection could not be removed.');
                });
            },

            loadConfig: function () {
                const source = window.GoJellyfinSources;

                Dashboard.showLoadingMsg();

                Promise.all([
                    window.ApiClient.getJSON(window.ApiClient.getUrl('Library/VirtualFolders')),
                    window.ApiClient.getJSON(window.ApiClient.getUrl('GoJellyfin/Sources')),
                    window.ApiClient.getJSON(window.ApiClient.getUrl('GoJellyfin/SourceApiKeyVariables'))
                ]).then(function (loaded) {
                    source.libraries = loaded[0] || [];
                    source.connections = loaded[1] || [];
                    source.variables = loaded[2] || [];
                    source.closeEditor();
                    source.render();
                }).catch(function (error) {
                    console.error(error);
                }).finally(function () {
                    Dashboard.hideLoadingMsg();
                });
            },

            init: function () {
                window.GoJellyfinSources.loadConfig();
            }
        };

        document.querySelector('#gojellyfinSourcesPage').addEventListener('pageshow', function () {
            window.GoJellyfinSources.init();
        });
    </script>
</div>
</body>
</html>
